<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextGen Academy — Teacher Portal</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#17233b;font:15px Arial,sans-serif}.top{background:#14234b;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.wrap{max-width:1050px;margin:18px auto;padding:0 12px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.login{max-width:420px;margin:9vh auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{font-weight:bold;font-size:13px}input,textarea,select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}button,.btn{border:0;border-radius:7px;padding:11px 14px;background:#3156d9;color:#fff;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin:3px}button.gray{background:#64748b}.msg{white-space:pre-wrap;background:#eff6ff;padding:10px;border-radius:7px;margin:8px 0}.muted{color:#64748b;font-size:13px}.item{border:1px solid #e2e8f0;border-radius:9px;padding:13px;margin:9px 0;background:#fff}.item h3{margin:0 0 8px}.tag{display:inline-block;background:#eaf0ff;color:#2447c5;padding:4px 8px;border-radius:999px;font-size:12px;margin:3px}table{border-collapse:collapse;width:100%;background:#fff}td,th{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.tablewrap{overflow:auto}[hidden]{display:none!important}
</style></head><body>
<section class="card login" id="loginBox"><h2>🎓 NextGen Academy</h2><h3>Teacher Login</h3><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Login</button></form><div id="loginMsg" class="msg" aria-live="polite"></div></section>
<div id="app" hidden><header class="top"><b>🎓 NextGen Academy — Teacher Portal</b><span id="who"></span><button id="logout" class="gray">Logout</button></header><main class="wrap"><section class="card"><h2 id="teacherName">Teacher</h2><div id="profile"></div></section><section class="card"><h2>📝 Publish Daily Homework</h2><form id="hwForm"><div class="grid"><div><label>Assigned Batch</label><select id="hwBatch" required></select></div><div><label>Subject</label><input id="hwSubject" required></div><div><label>Title</label><input id="hwTitle" required></div><div><label>Due Date</label><input id="hwDue" type="date" required></div><div><label>Attachment (image/PDF optional)</label><input id="hwFile" type="file" accept="image/*,.pdf"></div></div><label>Instructions</label><textarea id="hwDetails" required></textarea><button>Publish Homework</button></form><div id="hwMsg" class="msg"></div></section><section class="card"><h2>🎥 Schedule Online Class — Google Meet</h2><form id="classForm"><div class="grid"><div><label>Assigned Batch</label><select id="classBatch" required></select></div><div><label>Topic</label><input id="classTopic" required></div><div><label>Date</label><input id="classDate" type="date" required></div><div><label>Start</label><input id="classStart" type="time" required></div><div><label>End</label><input id="classEnd" type="time"></div><div><label>Google Meet URL</label><input id="classMeet" type="url" required></div></div><label>Instructions</label><textarea id="classNote"></textarea><button>Publish Online Class</button></form><div id="classMsg" class="msg"></div></section><section class="card"><h2>📚 My Homework</h2><div id="myHomework"></div></section><section class="card"><h2>📥 Student Submissions & Feedback</h2><div id="submissions"></div></section><section class="card"><h2>🎥 My Online Classes</h2><div id="myClasses"></div></section></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";import{getFirestore,collection,doc,getDoc,getDocs,query,where,addDoc,setDoc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/13.3.0/firebase-storage.js";
const cfg={apiKey:"AIzaSyCiuVDN52fNvW53wZ7qXUf6lVxXNOPPsLM",authDomain:"nextgen-academy-ba9ed.firebaseapp.com",projectId:"nextgen-academy-ba9ed",storageBucket:"nextgen-academy-ba9ed.firebasestorage.app",messagingSenderId:"250055044170",appId:"1:250055044170:web:a1781adf499d33570f4ab3",measurementId:"G-58XX0MKTPE"};
const app=initializeApp(cfg,"teacherPortal"),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=id=>document.getElementById(id);let uid="",teacher=null,batches=[];
function item(title,body,actions=[]){let d=document.createElement("div");d.className="item";let h=document.createElement("h3");h.textContent=title;let p=document.createElement("p");p.textContent=body||"";d.append(h,p);actions.forEach(a=>d.append(a));return d}
function link(label,url){let a=document.createElement("a");a.className="btn";a.textContent=label;a.href=url;a.target="_blank";a.rel="noopener noreferrer";return a}
async function rows(c,field,value){let s=await getDocs(query(collection(db,c),where(field,"==",value)));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function upload(file,folder){if(!file)return null;if(file.size>10*1024*1024)throw Error("ফাইল ১০ MB-এর মধ্যে হতে হবে।");let path=`${folder}/${uid}/${Date.now()}_${file.name.replace(/[^\w.-]/g,"_")}`;await uploadBytes(ref(storage,path),file);return {url:await getDownloadURL(ref(storage,path)),name:file.name,path}}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);$("loginMsg").textContent=""}catch(x){$ ("loginMsg").textContent=x.message}};$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$("loginBox").hidden=false;$("app").hidden=true;return}try{uid=u.uid;let a=await getDoc(doc(db,"teacherAccounts",uid));if(!a.exists())throw Error("এই Login-এর সঙ্গে কোনো Teacher profile যুক্ত নেই। Admin-এর সঙ্গে যোগাযোগ করুন।");let tid=a.data().teacherId,t=await getDoc(doc(db,"teachers",tid));if(!t.exists())throw Error("Teacher profile পাওয়া যায়নি।");teacher={id:tid,...t.data()};$("loginBox").hidden=true;$("app").hidden=false;$("who").textContent=u.email;$("teacherName").textContent=teacher.name||"Teacher";$("profile").textContent=`Subject: ${teacher.subject||"—"} • Phone: ${teacher.phone||"—"}`;await loadTeacher()}catch(x){$("loginMsg").textContent=x.message;await signOut(auth)}});
async function loadTeacher(){batches=await rows("batches","teacherId",teacher.id);for(let id of ["hwBatch","classBatch"]){let el=$(id),old=el.value;el.replaceChildren(new Option("Select Batch",""));batches.forEach(b=>el.add(new Option(`${b.name} (${b.className||""})`,b.id)));if(batches.some(b=>b.id===old))el.value=old}
 let [hws,subs,classes]=await Promise.all([rows("homework","teacherUid",uid),rows("homeworkSubmissions","teacherUid",uid),rows("onlineClasses","teacherUid",uid)]);
 let hp=$("myHomework");hp.replaceChildren();hws.forEach(h=>{let d=item(h.title||"Homework",`${h.className||""} • ${h.batchName||""} • ${h.subject||""} • Due: ${h.dueDate||""}`);if(h.attachmentUrl)d.append(link("Attachment",h.attachmentUrl));hp.append(d)});if(!hws.length)hp.textContent="এখনো কোনো Homework প্রকাশ করেননি।";
 let sp=$("submissions");sp.replaceChildren();if(!subs.length)sp.textContent="এখনো কোনো Submission নেই।";subs.forEach(s=>{let d=item(s.studentName||s.studentId,`${s.answerText||"No text answer"} • Status: ${s.status||"Submitted"}`);if(s.fileUrl)d.append(link("View Student File",s.fileUrl));let form=document.createElement("form"),feedback=document.createElement("textarea"),marks=document.createElement("input"),status=document.createElement("select"),btn=document.createElement("button");feedback.placeholder="Teacher feedback";feedback.value=s.feedback||"";marks.type="number";marks.placeholder="Marks (optional)";if(s.marks!==undefined)marks.value=s.marks;["Reviewed","Accepted","Needs Correction"].forEach(v=>status.add(new Option(v,v)));status.value=s.status==="Submitted"?"Reviewed":s.status||"Reviewed";btn.textContent="Save Feedback";form.append(feedback,marks,status,btn);form.onsubmit=async e=>{e.preventDefault();try{await updateDoc(doc(db,"homeworkSubmissions",s.id),{feedback:feedback.value.trim(),marks:marks.value===""?null:Number(marks.value),status:status.value,reviewedAt:serverTimestamp(),reviewedBy:uid});alert("Feedback saved");await loadTeacher()}catch(x){alert(x.message)}};d.append(form);sp.append(d)});
 let cp=$("myClasses");cp.replaceChildren();classes.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).forEach(c=>cp.append(item(c.topic||"Online Class",`${c.date||""} • ${c.startTime||""} • ${c.batchName||""}`,[link("Open Meet",c.meetUrl)])));if(!classes.length)cp.textContent="এখনো কোনো Online Class নেই।";
}
$("hwForm").onsubmit=async e=>{e.preventDefault();let b=batches.find(x=>x.id===$("hwBatch").value);if(!b)return;try{let up=await upload($("hwFile").files[0],"homework-attachments");await addDoc(collection(db,"homework"),{className:b.className||"",batchId:b.id,batchName:b.name,teacherId:teacher.id,teacherUid:uid,teacherName:teacher.name,subject:$("hwSubject").value.trim(),title:$("hwTitle").value.trim(),details:$("hwDetails").value.trim(),dueDate:$("hwDue").value,attachmentUrl:up?.url||"",attachmentName:up?.name||"",attachmentPath:up?.path||"",createdAt:serverTimestamp(),createdBy:uid});e.target.reset();$("hwMsg").textContent="Homework প্রকাশ হয়েছে।";await loadTeacher()}catch(x){$ ("hwMsg").textContent=x.message}};
$("classForm").onsubmit=async e=>{e.preventDefault();let b=batches.find(x=>x.id===$("classBatch").value);if(!b)return;let url=$("classMeet").value.trim();if(!/^https:\/\/meet\.google\.com\//i.test(url)){$("classMsg").textContent="সঠিক Google Meet URL দিন।";return}try{await addDoc(collection(db,"onlineClasses"),{batchId:b.id,batchName:b.name,className:b.className||"",teacherId:teacher.id,teacherUid:uid,teacherName:teacher.name,topic:$("classTopic").value.trim(),date:$("classDate").value,startTime:$("classStart").value,endTime:$("classEnd").value,meetUrl:url,note:$("classNote").value.trim(),createdAt:serverTimestamp(),createdBy:uid});e.target.reset();$("classMsg").textContent="Online Class প্রকাশ হয়েছে।";await loadTeacher()}catch(x){$ ("classMsg").textContent=x.message}};
</script></body></html>
