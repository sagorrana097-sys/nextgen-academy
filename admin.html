<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextGen Academy Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5ff;
}

.container {
    max-width: 420px;
    margin: 70px auto;
    padding: 30px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 25px #0002;
}

h2 {
    text-align: center;
    color: #2445a5;
}

input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    background: #2849c7;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
}

#dashboard {
    display: none;
}

.card {
    padding: 20px;
    margin-top: 15px;
    background: #edf2ff;
    border-radius: 10px;
}

#message {
    color: red;
    text-align: center;
}
</style>
</head>

<body>

<div class="container" id="loginBox">

<h2>NextGen Academy</h2>
<h3 style="text-align:center">Admin Login</h3>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Admin Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">Login</button>

</form>

<p id="message"></p>

</div>


<div class="container" id="dashboard">

<h2>Admin Dashboard</h2>

<h3 id="welcome"></h3>

<div class="card">
<h3>📚 Course Management</h3>
<p>Manage Academy Courses</p>
</div>

<div class="card">
<h3>👨‍🎓 Student Management</h3>
<p>Manage Students</p>
</div>

<div class="card">
<h3>📢 Notice Management</h3>
<p>Manage Notices</p>
</div>

<div class="card">
<h3>📝 Admission Management</h3>
<p>Manage Admissions</p>
</div>

<br>

<button id="logout">Logout</button>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";


const firebaseConfig = {
apiKey: "AIzaSyCiuVDN52fNvW53wZ7qXUf6lVxXNOPPsLM",
authDomain: "nextgen-academy-ba9ed.firebaseapp.com",
projectId: "nextgen-academy-ba9ed",
storageBucket: "nextgen-academy-ba9ed.firebasestorage.app",
messagingSenderId: "250055044170",
appId: "1:250055044170:web:a1781adf499d33570f4ab3",
measurementId: "G-58XX0MKTPE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

document.getElementById("loginForm")
.addEventListener("submit", async (e) => {

e.preventDefault();

const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

try {

await signInWithEmailAndPassword(auth, email, password);

message.textContent = "";

} catch (error) {

message.textContent = "Login failed: " + error.message;

}

});


onAuthStateChanged(auth, (user) => {

if (user) {

loginBox.style.display = "none";
dashboard.style.display = "block";

document.getElementById("welcome").textContent =
"Welcome, " + user.email;

} else {

loginBox.style.display = "block";
dashboard.style.display = "none";

}

});


document.getElementById("logout")
.addEventListener("click", async () => {

await signOut(auth);

});

</script>

</body>
</html>
